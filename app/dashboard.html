<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surf Arb Dashboard</title>
  <style>
    :root { --ink:#16120c; --paper:#f3ead7; --rule:#c9b48a; --stamp:#9c2b16; --ok:#1f6b3a; --chip:#efe4cc; --card:#fffaf0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Noto Sans TC", "PingFang TC", sans-serif; background:var(--paper); color:var(--ink); }
    .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
    h1 { font-size:28px; margin:0 0 6px; }
    .kicker { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--stamp); font-weight:700; }
    .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:16px 0; }
    .tile { background:var(--chip); border:1px solid var(--rule); padding:12px; }
    .tile b { display:block; font-size:22px; font-family:ui-monospace,monospace; }
    .tile span { font-size:12px; color:#6b6256; }
    button { font:inherit; border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:8px 12px; margin:0 6px 8px 0; cursor:pointer; }
    button.ghost { background:transparent; color:var(--ink); }
    .bank { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:8px 0 14px; }
    .bank label { font-size:13px; }
    .bank input { font:inherit; width:120px; padding:7px 8px; border:1px solid var(--rule); background:var(--card); }
    table { width:100%; border-collapse:collapse; background:var(--card); font-size:13px; margin:10px 0 22px; }
    th,td { border:1px solid var(--rule); padding:7px 8px; text-align:left; vertical-align:top; }
    th { background:var(--chip); font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
    .ok { color:var(--ok); font-weight:700; }
    .bad { color:var(--stamp); font-weight:700; }
    .mono { font-family:ui-monospace,monospace; }
    .muted { color:#6b6256; }
    .bad { color:var(--stamp); font-weight:700; }
    pre { background:#1b1712; color:#f3ead7; padding:12px; overflow:auto; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Surf · live control</div>
    <h1 id="stateLine">載入中…</h1>
    <p id="sub"></p>
    <div>
      <button onclick="act('resume')">繼續跑</button>
      <button class="ghost" onclick="act('pause')">暫停</button>
      <button class="ghost" onclick="act('paper')">強制紙盤</button>
      <button class="ghost" onclick="act('kill')">緊急停機</button>
    </div>
    <div class="bank">
      <label for="bankroll">紙盤本金 $</label>
      <input id="bankroll" type="number" min="50" max="100000" step="50" />
      <button class="ghost" onclick="saveBankroll()">儲存金額</button>
      <button onclick="resetPaper()">重置紙盤</button>
      <span id="bankHint" style="font-size:12px;color:#6b6256"></span>
    </div>
    <div class="row" id="tiles"></div>
    <h2>最近掃描</h2>
    <div style="overflow:auto"><table><thead><tr><th>市場</th><th>類型</th><th>價</th><th>股</th><th>淨利</th><th>結果</th></tr></thead><tbody id="scans"></tbody></table></div>
    <h2>成交</h2>
    <div style="overflow:auto"><table><thead><tr><th>狀態</th><th>市場</th><th>模式</th><th>淨利</th></tr></thead><tbody id="trades"></tbody></table></div>
    <h2>掛單</h2>
    <div style="overflow:auto"><table><thead><tr><th>市場</th><th>價</th><th>股</th><th>Up</th><th>Down</th><th>鎖$</th></tr></thead><tbody id="rest"></tbody></table></div>
    <h2>倉位</h2>
    <div style="overflow:auto"><table><thead><tr><th>市場</th><th>Up</th><th>Down</th></tr></thead><tbody id="inv"></tbody></table></div>
    <h2>事件</h2>
    <pre id="events">—</pre>
  </div>
  <script>
    async function load() {
      const r = await fetch("/api/state", { credentials: "same-origin" });
      if (!r.ok) { document.getElementById("stateLine").textContent = "未授權，加 ?t=DASHBOARD_TOKEN"; return; }
      const d = await r.json();
      const s = d.settings || {};
      const st = d.stats || {};
      const killed = s.killed;
      const run = s.engine_running;
      const circuit = d.circuit;
      document.getElementById("stateLine").textContent =
        (killed ? "已停機" : circuit ? "日虧熔斷（停新倉）" : run ? "全自動運行中" : "暫停") + " · " + (d.mode === "live" ? "實盤" : "紙盤");
      const tape = (d.last_loop||{}).tape || {};
      const nfmt = (x, digits) => (x==null || x==="") ? "—" : Number(x).toFixed(digits==null?2:digits);
      const shareNet = (x) => (x==null || x==="") ? "—" : ((Number(x)>=0?"+":"") + Number(x).toFixed(3));
      document.getElementById("sub").textContent =
        "keys " + (d.keys_ready ? "ready" : "missing") +
        " · WS " + (d.ws_status || "off") +
        " · rev " + (s.strategy_rev || "?") +
        " · 掃描 " + (st.scans_24h||0) + " · 成交 " + (st.trades_24h||0) +
        (st.hedges_24h ? (" · 對沖 " + st.hedges_24h) : "") +
        " · 可 merge 倉 $" + Number((d.paper||st).inventory_value||0).toFixed(2) +
        ((d.last_loop||{}).status === "error" ? " · 引擎錯誤 " + ((d.last_loop||{}).error||"") : "") +
        (tape.n ? (" · 盤口 " + tape.n + " 盤 ask合 " + nfmt(tape.min_ask_sum) + " taker " + shareNet(tape.max_taker_net) + "/股" + (tape.ws_pairs!=null ? (" WS盤 " + tape.ws_pairs) : "") + (tape.stale_pairs ? (" 過期 " + tape.stale_pairs) : "") + (tape.nearest_slug ? (" · 最近 " + tape.nearest_slug) : "") + (tape.slugs && tape.slugs.length ? (" · 掃 " + tape.slugs.slice(0,6).join(", ")) : "")) : (tape.stale_pairs ? (" · 過期盤 " + tape.stale_pairs) : ""));
      const p = d.paper || st;
      const planned = Number((s.paper_starting_cash != null ? s.paper_starting_cash : p.starting) || 500);
      const bank = document.getElementById("bankroll");
      if (document.activeElement !== bank) bank.value = String(planned);
      document.getElementById("bankHint").textContent =
        Math.abs(planned - Number(p.starting||0)) > 0.009
          ? ("下次重置用 $" + planned.toFixed(0) + "；帳本而家由 $" + Number(p.starting||0).toFixed(0) + " 起計")
          : "撳重置會清倉並用上面金額重開";
      const pnlCls = (n) => Number(n) > 0.005 ? "ok" : Number(n) < -0.005 ? "bad" : "";
      const money = (n, label) => {
        const x = Number(n || 0);
        const sign = x > 0 ? "+" : "";
        return tile(sign + "$" + x.toFixed(2), label, pnlCls(x));
      };
      document.getElementById("tiles").innerHTML = [
        tile("$" + Number(p.starting || 0).toFixed(2), "紙盤本金"),
        tile("$" + Number(p.cash || 0).toFixed(2), "現金"),
        tile("$" + Number(p.reserved || 0).toFixed(2), "凍結掛單"),
        tile("$" + Number(p.equity || 0).toFixed(2), "權益"),
        tile(String(p.resting || st.resting || 0), "掛單"),
        money(p.total_pnl, "累計 PnL"),
        money(p.today_pnl, "今日 PnL"),
        tile(String(st.open_markets||0), "開倉市場"),
        tile(String((d.last_loop||{}).signals ?? "—"), "上一圈信號"),
        tile(String((d.last_loop||{}).fills ?? "—"), "上一圈成交"),
        tile(String((d.last_loop||{}).snapshot_signals ?? "—"), "snapshot會成"),
        tile(String((d.last_loop||{}).fok_fills ?? "—"), "確認成交"),
        tile(String((d.last_loop||{}).fok_kills ?? "—"), "確認殺單"),
        tile(s.taker_fok===false ? "關" : "開", "延遲確認"),
        tile(d.ws_status || "off", "WebSocket"),
        tile(String(s.strategy_rev || "—"), "策略 rev"),
        tile({"auto":"自動","complement":"互補","favorite":"大熱"}[s.strategy_mode] || (s.strategy_mode || "—"), "策略模式"),
        tile((function(){
          const fw = Number(s.favorite_window_seconds);
          const win = (s.favorite_window_seconds==null || s.favorite_window_seconds==="") ? "30s" : (fw<=0 ? "全段" : (Math.round(fw)+"s"));
          const dir = ({auto:"自動",up:"Up",down:"Down"}[s.favorite_dir] || "自動");
          return ((Number(s.favorite_min_price||0.95)*100).toFixed(0)) + "–" + ((Number(s.favorite_max_price||0.99)*100).toFixed(0)) + "¢ / " + win + " / " + dir;
        })(), "大熱區間／尾窗／方向"),
        tile(tape.ws_pairs==null ? "—" : String(tape.ws_pairs), "WS 新鮮盤"),
        tile(tape.stale_pairs==null ? "—" : String(tape.stale_pairs), "過期盤"),
        tile(tape.empty_ask_legs==null ? "—" : String(tape.empty_ask_legs), "單邊空簿"),
        tile(Number(s.maker_window_seconds||0) < 3 ? "關" : (Number(s.maker_window_seconds) + "s"), "掛單尾窗"),
        tile(nfmt(tape.min_ask_sum), "盤口 ask合"),
        tile(shareNet(tape.max_taker_net), "taker淨/股", pnlCls(tape.max_taker_net)),
        ...(Number(s.maker_window_seconds||0) < 3 ? [] : [tile(nfmt(tape.max_maker_gross), "掛單缺口")]),
        tile(tape.nearest_s==null ? "—" : (Math.round(Number(tape.nearest_s)) + "s"), tape.nearest_slug ? ("最近 " + String(tape.nearest_slug).slice(0,22)) : "最近完場"),
        tile((Array.isArray(s.tags) ? s.tags : [s.tag || "15M"]).join("+"), "週期"),
        tile(String(s.scan_limit || 16), "每圈最多盤"),
        tile(((d.geo||{}).country || "?") + (d.geo && d.geo.api_open === false ? " 限" : " API✓"), "IP / CLOB"),
        tile(s.auto_execute ? "ON" : "OFF", "全自動")
      ].join("");
      const statusZh = {paper_filled:"紙盤成交", paper_fok_killed:"FOK殺單", fok_killed:"FOK殺單", paper_hedged:"單邊對沖", paper_dumped:"單邊出貨", paper_settled:"結算", paper_missed:"錯過", filled:"成交", cancelled:"已撤"};
      const fmtTs = (ts) => {
        if (!ts) return "";
        try { return new Date(Number(ts)*1000).toISOString().slice(11,19) + "Z"; } catch(e) { return ""; }
      };
      document.getElementById("scans").innerHTML = (d.scans||[]).map(x => {
        const p = x.payload || {};
        const px = (p.up!=null && p.down!=null) ? (p.up+"+"+p.down) : "—";
        const kind = (p.strategy==="favorite" ? "大熱" : "") + (x.kind==="maker" ? "掛單" : esc(x.kind));
        return "<tr><td>"+esc(p.title||x.slug)+"<div class=muted>"+fmtTs(x.ts)+(p.book?(" · "+p.book):"")+"</div></td><td>"+kind+"</td><td class=mono>"+px+"</td><td>"+(p.shares==null?"—":p.shares)+"</td><td>$"+Number(p.net||0).toFixed(2)+"</td><td>"+esc(p.reason||"")+"</td></tr>";
      }).join("") || "<tr><td colspan=6>本輪未有 taker 信號（舊 maker 掃描已隱藏）</td></tr>";
      document.getElementById("trades").innerHTML = (d.trades||[]).map(x =>
        "<tr><td>"+esc(statusZh[x.status]||x.status)+"<div class=muted>"+fmtTs(x.ts)+"</div></td><td>"+esc(x.slug)+"</td><td>"+esc(x.mode)+"/"+(x.kind==="maker"?"掛單":esc(x.kind))+"</td><td class='"+(pnlCls(x.net))+"'>$"+Number(x.net||0).toFixed(2)+"</td></tr>"
      ).join("") || "<tr><td colspan=4>暫無（掛單／單邊碰到已隱藏）</td></tr>";
      document.getElementById("rest").innerHTML = (d.resting||[]).map(x =>
        "<tr><td>"+esc(x.slug||x.condition_id)+"</td><td class=mono>"+x.up_price+"+"+x.down_price+"</td><td>"+Number(x.shares||0).toFixed(1)+"</td><td>"+(x.up_filled?"✓":"…")+"</td><td>"+(x.down_filled?"✓":"…")+"</td><td>$"+Number(x.reserved||0).toFixed(2)+"</td></tr>"
      ).join("") || "<tr><td colspan=6>暫無（Rev 6 預設停掛單）</td></tr>";
      document.getElementById("inv").innerHTML = (d.inventory||[]).map(x =>
        "<tr><td>"+esc(x.slug||x.condition_id)+(x.kind==="favorite"?" · 大熱":"")+"</td><td>"+Number(x.up).toFixed(1)+"</td><td>"+Number(x.down).toFixed(1)+"</td></tr>"
      ).join("") || "<tr><td colspan=3>暫無倉位（0/0 空列已清）</td></tr>";
      document.getElementById("events").textContent = (d.events||[]).map(e => e.level + " " + e.message).join("\n") || "—";
    }
    function tile(v, l, cls) {
      return "<div class=tile><b class='"+(cls||"")+"'>"+v+"</b><span>"+l+"</span></div>";
    }
    function esc(s) { return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    function bankAmount() {
      const n = Number(document.getElementById("bankroll").value);
      return n;
    }
    async function saveBankroll() {
      const n = bankAmount();
      if (!n || n < 50) { alert("本金最少 $50"); return; }
      await fetch("/api/action/set_paper_cash?amount=" + encodeURIComponent(n), { method:"POST", credentials:"same-origin" });
      load();
    }
    async function resetPaper() {
      const n = bankAmount();
      if (!n || n < 50) { alert("本金最少 $50"); return; }
      if (!confirm("重置紙盤到 $" + n.toFixed(0) + " 並清倉／撤掛單？成交紀錄會留低。")) return;
      await fetch("/api/action/reset_paper?amount=" + encodeURIComponent(n), { method:"POST", credentials:"same-origin" });
      load();
    }
    async function act(name) {
      if (name === "kill" && !confirm("確認緊急停機？")) return;
      await fetch("/api/action/"+name, { method:"POST", credentials:"same-origin" });
      load();
    }
    load();
    setInterval(load, 2500);
  </script>
</body>
</html>
