<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Surf · 5M TWAP Wall</title>
  <style>
    :root {
      --bg:#07090d; --panel:#0e141c; --line:#1c2a3a; --ink:#e8f4ff; --dim:#7d8ea3;
      --ok:#3dff9a; --bad:#ff4d6d; --warn:#ffd166; --cyan:#5ce1ff; --vio:#9b8cff;
      --live:#ff5a5a;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
      font-family:"Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif; }
    button, input { font:inherit; }
    .wall {
      display:grid;
      gap:12px;
      padding:12px 12px calc(18px + env(safe-area-inset-bottom));
      max-width:1280px;
      margin:0 auto;
      grid-template-columns: minmax(220px,0.9fr) minmax(260px,1.2fr) minmax(220px,0.9fr);
      grid-template-areas:
        "head head head"
        "money tape gauges"
        "pipe pipe pipe"
        "coins coins coins"
        "log log log"
        "ctrl ctrl ctrl";
    }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0; }
    .head { grid-area:head; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
    .brand { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); font-weight:700; }
    .live { display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.12em; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok); animation:pulse 1.6s ease-in-out infinite; }
    .dot.off { background:var(--bad); box-shadow:0 0 10px var(--bad); animation:none; }
    .clock { margin-left:auto; font-family:ui-monospace,monospace; color:var(--dim); font-size:12px; }
    .mode { border:1px solid var(--live); color:var(--live); padding:3px 8px; border-radius:999px; font-size:11px; }
    .mode.paper { border-color:var(--warn); color:var(--warn); }
    .money { grid-area:money; }
    .cash { font-family:ui-monospace,monospace; font-size:clamp(32px,6vw,52px); font-weight:700; letter-spacing:.04em;
      text-shadow:0 0 18px rgba(61,255,154,.35); line-height:1.05; }
    .cash.bad { color:var(--bad); text-shadow:0 0 18px rgba(255,77,109,.35); }
    .label { font-size:11px; color:var(--dim); letter-spacing:.12em; text-transform:uppercase; }
    .meta { display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:8px; font-family:ui-monospace,monospace; font-size:12px; color:var(--dim); }
    .note { color:var(--warn); margin-top:8px; font-size:12px; }
    .tape { grid-area:tape; display:flex; flex-direction:column; min-height:180px; }
    .tape-list { flex:1; overflow:auto; font-family:ui-monospace,monospace; font-size:12px; line-height:1.45; }
    .row { display:grid; grid-template-columns:54px 46px 1fr auto; gap:8px; padding:5px 0; border-bottom:1px solid #16202c; }
    .tag { font-weight:700; }
    .tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); }
    .qual { margin-top:8px; border:1px solid var(--ok); color:var(--ok); border-radius:10px; padding:8px 10px; font-size:12px; }
    .gauges { grid-area:gauges; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .gauge { text-align:center; }
    .gauge svg { width:72px; height:72px; }
    .gauge b { display:block; font-family:ui-monospace,monospace; font-size:12px; margin-top:-8px; }
    .gauge span { display:block; font-size:10px; color:var(--dim); letter-spacing:.1em; }
    .pipe { grid-area:pipe; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .stage { text-align:center; padding:10px 6px; border:1px solid var(--line); border-radius:12px; background:#0b1118; }
    .stage b { display:block; font-size:18px; font-family:ui-monospace,monospace; color:var(--cyan); }
    .stage em { font-style:normal; font-size:11px; letter-spacing:.14em; color:var(--ink); }
    .stage small { display:block; color:var(--dim); font-size:10px; margin-top:4px; }
    .coins { grid-area:coins; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
    .slot { border:1px solid var(--line); border-radius:12px; padding:10px 8px; min-height:92px; background:#0b1118; }
    .slot.LIVE { border-color:var(--ok); box-shadow:0 0 12px rgba(61,255,154,.15); }
    .slot.PASS { border-color:var(--cyan); }
    .slot.SKIP { border-color:#3a2430; }
    .slot .sym { font-weight:700; letter-spacing:.08em; }
    .slot .st { font-size:10px; color:var(--dim); letter-spacing:.1em; }
    .slot .det { font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); margin-top:6px; }
    .log { grid-area:log; }
    .log-list { max-height:240px; overflow:auto; font-family:ui-monospace,monospace; font-size:12px; line-height:1.5; }
    .log-list div { padding:4px 0; border-bottom:1px solid #16202c; color:var(--dim); }
    .log-list .ok { color:var(--ok); } .log-list .warn { color:var(--warn); }
    .ctrl { grid-area:ctrl; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button { background:#151d27; color:var(--ink); border:1px solid var(--line); padding:8px 12px; border-radius:10px; cursor:pointer; }
    button.danger { border-color:var(--bad); color:var(--bad); }
    button.ghost { color:var(--dim); }
    .bank { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .bank input { width:110px; background:#0b1118; border:1px solid var(--line); color:var(--ink); padding:7px 8px; border-radius:8px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @media (max-width: 860px) {
      .wall {
        grid-template-columns: 1fr;
        grid-template-areas:
          "head"
          "money"
          "coins"
          "gauges"
          "pipe"
          "tape"
          "log"
          "ctrl";
        padding:10px 10px calc(16px + env(safe-area-inset-bottom));
      }
      .gauges { grid-template-columns:repeat(3,1fr); }
      .pipe { grid-template-columns:repeat(3,1fr); }
      .coins { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .cash { font-size:42px; }
      .tape { min-height:140px; max-height:220px; }
      .ctrl { position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 18%); padding-top:8px; }
    }
    @media (max-width: 420px) {
      .gauges { grid-template-columns:repeat(2,1fr); }
      .pipe { grid-template-columns:repeat(2,1fr); }
      .row { grid-template-columns:44px 40px 1fr; }
      .row .extra { display:none; }
    }
  </style>
</head>
<body>
  <div class="wall">
    <header class="panel head">
      <div class="brand">SURF · 5M TWAP WALL</div>
      <div class="live"><span id="dot" class="dot"></span><span id="liveLabel">載入中</span></div>
      <span id="modeChip" class="mode">—</span>
      <span id="clock" class="clock">—</span>
    </header>
    <section class="panel money">
      <div class="label" id="cashLabel">可用 USDC</div>
      <div class="cash" id="cash">—</div>
      <div class="meta" id="moneyMeta"></div>
      <div class="note" id="notes"></div>
    </section>
    <section class="panel tape">
      <div class="label">掃描日誌</div>
      <div class="tape-list" id="tape">載入中…</div>
      <div class="qual" id="qual" style="display:none"></div>
    </section>
    <section class="panel gauges" id="gauges"></section>
    <section class="pipe" id="pipe"></section>
    <section class="coins" id="coins"></section>
    <section class="panel log">
      <div class="label">運行日誌</div>
      <div class="log-list" id="log">—</div>
    </section>
    <section class="panel ctrl">
      <button onclick="act('resume')">繼續跑</button>
      <button class="ghost" onclick="act('pause')">暫停</button>
      <button class="ghost" onclick="act('paper')">強制紙盤</button>
      <button id="clearCircuit" class="ghost" style="display:none" onclick="clearCircuit()">解除今日熔斷</button>
      <button class="danger" onclick="act('kill')">緊急停機</button>
      <div class="bank" id="bankBlock">
        <label for="bankroll">紙盤本金 $</label>
        <input id="bankroll" type="number" min="50" max="100000" step="50" />
        <button class="ghost" onclick="saveBankroll()">儲存</button>
        <button onclick="resetPaper()">重置紙盤</button>
        <span id="bankHint" class="label"></span>
      </div>
    </section>
  </div>
  <script>
    function qs() { return new URLSearchParams(location.search).get("t"); }
    function api(path, opt) {
      const t = qs();
      const join = path.indexOf("?") >= 0 ? "&" : "?";
      return fetch(t ? (path + join + "t=" + encodeURIComponent(t)) : path, Object.assign({ credentials:"same-origin" }, opt || {}));
    }
    function esc(s) { return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    function signed(n) { return (Number(n)>=0?"+":"") + "$" + Number(n||0).toFixed(2); }
    function fmtTs(ts) {
      if (!ts) return "";
      try {
        return new Date(Number(ts)*1000).toLocaleTimeString("en-GB", {
          timeZone: "Asia/Hong_Kong",
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      } catch(e) { return ""; }
    }
    function nowHk() {
      return new Date().toLocaleTimeString("en-GB", {
        timeZone: "Asia/Hong_Kong",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }) + " HKT";
    }
    function ring(pct, color) {
      const r=26, c=2*Math.PI*r, p=Math.max(0,Math.min(100,Number(pct)||0)), dash=(p/100)*c;
      return '<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="#1c2838" stroke-width="6"/>'
        + '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round"'
        + ' stroke-dasharray="'+dash+' '+c+'" transform="rotate(-90 36 36)"/></svg>';
    }
    async function load() {
      const r = await api("/api/state");
      if (!r.ok) { document.getElementById("liveLabel").textContent = "未授權，加 ?t=DASHBOARD_TOKEN"; return; }
      const d = await r.json();
      const b = (d.wall && d.wall.board) || d.board || {};
      const w = d.wall || {};
      const s = d.settings || {};
      const live = b.mode === "live" || d.mode === "live";
      const halted = !!(b.halted || d.clob_halted);
      document.getElementById("clock").textContent = nowHk();
      document.getElementById("liveLabel").textContent = halted ? "CLOB 暫停" : (b.state || "—");
      document.getElementById("dot").className = "dot" + ((halted || !s.engine_running || s.killed) ? " off" : "");
      const chip = document.getElementById("modeChip");
      chip.textContent = live ? "🔴 實盤" : "🧪 紙盤";
      chip.className = "mode" + (live ? "" : " paper");
      document.getElementById("cashLabel").textContent = b.cash_label || (live ? "可用 USDC" : "紙盤現金");
      const cashEl = document.getElementById("cash");
      cashEl.textContent = (b.cash==null || b.cash==="") ? "—" : ("$" + Number(b.cash).toFixed(2));
      cashEl.className = "cash" + (Number(b.today_pnl) < -0.005 ? " bad" : "");
      const moneyBits = [
        "今日 " + signed(b.today_pnl),
        "單筆 $" + Number(b.stake||0).toFixed(0),
        "開倉 " + Number(b.open_n||0),
        "成本 $" + Number(b.open_cost||0).toFixed(2),
        "rev " + (b.rev || s.strategy_rev || "—")
      ];
      if (!live && b.starting != null) moneyBits.unshift("本金 $" + Number(b.starting).toFixed(2));
      if (!live && b.equity != null) moneyBits.splice(1, 0, "權益 $" + Number(b.equity).toFixed(2));
      document.getElementById("moneyMeta").textContent = moneyBits.join(" · ");
      document.getElementById("notes").textContent = (b.notes || []).join(" · ");
      document.getElementById("clearCircuit").style.display = d.circuit ? "inline-block" : "none";
      document.getElementById("bankBlock").style.display = live ? "none" : "flex";
      const p = d.paper || {};
      const planned = Number((s.paper_starting_cash != null ? s.paper_starting_cash : p.starting) || 500);
      const bank = document.getElementById("bankroll");
      if (document.activeElement !== bank) bank.value = String(planned);
      document.getElementById("bankHint").textContent = live ? "" : ("重置用 $" + planned.toFixed(0));
      const tape = (w.tape || []).slice(0, 18);
      document.getElementById("tape").innerHTML = tape.map(row => {
        const tag = row.ok ? "PASS" : "SKIP";
        const extra = row.lead_bps!=null ? (Number(row.lead_bps)>=0?"+":"") + Number(row.lead_bps).toFixed(1) + "bps"
          : (row.ask!=null ? Number(row.ask).toFixed(2) : "");
        return '<div class="row"><span>'+esc(fmtTs(row.ts))+'</span><span class="tag '+(row.ok?"ok":"bad")+'">'+tag+'</span>'
          + '<span>'+esc(row.slug||"")+' · '+esc(row.reason_zh||row.reason||"")+'</span>'
          + '<span class="extra">'+esc(extra)+'</span></div>';
      }).join("") || '<div class="row"><span></span><span></span><span>等掃描…</span></div>';
      const q = w.qualified;
      const qel = document.getElementById("qual");
      if (q) { qel.style.display="block"; qel.textContent = "QUALIFIED "+(q.slug||"")+" "+(q.reason_zh||""); }
      else qel.style.display="none";
      const colors = {lead:"#3dff9a", band:"#5ce1ff", left:"#ffd166", ws:"#9b8cff", cl:"#ff8ad4"};
      document.getElementById("gauges").innerHTML = (w.gauges||[]).map(g =>
        '<div class="gauge">'+ring(g.pct, colors[g.id]||"#5ce1ff")+'<b>'+esc(g.value)+'</b><span>'+esc(g.label)+' · '+esc(g.hint||"")+'</span></div>'
      ).join("");
      document.getElementById("pipe").innerHTML = (w.pipeline||[]).map(st =>
        '<div class="stage"><em>'+esc(st.label)+'</em><b>'+esc(st.n)+'</b><small>'+esc(st.hint)+" · "+esc(st.sub)+'</small></div>'
      ).join("");
      document.getElementById("coins").innerHTML = (w.slots||[]).map(sl => {
        const bits = [];
        if (sl.lead_bps!=null) bits.push((Number(sl.lead_bps)>=0?"+":"")+Number(sl.lead_bps).toFixed(1)+"bps");
        if (sl.ask!=null) bits.push((Number(sl.ask)*100).toFixed(0)+"¢");
        if (sl.left!=null) bits.push(Math.round(Number(sl.left))+"s");
        if (sl.cost) bits.push("$"+Number(sl.cost).toFixed(2));
        if (sl.reason_zh && sl.status!=="LIVE") bits.push(sl.reason_zh);
        return '<div class="slot '+esc(sl.status)+'"><div class="sym">'+esc(String(sl.asset||"").toUpperCase())+'</div>'
          + '<div class="st">'+esc(sl.status)+'</div><div class="det">'+esc(bits.join(" · ")||"等待窗")+'</div></div>';
      }).join("");
      document.getElementById("log").innerHTML = (w.log||[]).map(row =>
        '<div class="'+(row.kind==="warn"?"warn":(row.ok?"ok":""))+'">'+esc(fmtTs(row.ts))+" "+esc(row.text)+"</div>"
      ).join("") || "—";
    }
    function bankAmount() { return Number(document.getElementById("bankroll").value); }
    async function saveBankroll() {
      const n = bankAmount();
      if (!n || n < 50) { alert("本金最少 $50"); return; }
      await api("/api/action/set_paper_cash?amount=" + encodeURIComponent(n), { method:"POST" });
      load();
    }
    async function resetPaper() {
      const n = bankAmount();
      if (!n || n < 50) { alert("本金最少 $50"); return; }
      if (!confirm("重置紙盤到 $" + n.toFixed(0) + " 並清倉／撤掛單？成交紀錄會留低。")) return;
      await api("/api/action/reset_paper?amount=" + encodeURIComponent(n), { method:"POST" });
      load();
    }
    async function clearCircuit() {
      if (!confirm("解除今日熔斷：今日 PnL 由 0 再計。現金／倉唔清。確定？")) return;
      await api("/api/action/clear_circuit", { method:"POST" });
      load();
    }
    async function act(name) {
      if (name === "kill" && !confirm("確認緊急停機？")) return;
      await api("/api/action/"+name, { method:"POST" });
      load();
    }
    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
