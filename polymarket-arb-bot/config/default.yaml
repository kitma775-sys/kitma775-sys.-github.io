# polyarb default configuration. Every key is optional; omitted keys use the
# dataclass defaults in polyarb/config.py. Money values are pUSD (= USD).

convert:                 # NegRisk NO-basket -> convertPositions -> pUSD + surplus YES liquidation (risk: low)
  enabled: true
  min_profit_usd: 0.08   # 0-second on-chain conversion; compound fast
  min_edge: 0.0025       # profit / capital after all taker fees
  min_unit_edge: 0.0005  # every marginal basket unit must still earn this
  max_legs: 15           # single atomic POST /orders batch (15 legs max per batch)
  gas_usd: 0.0           # relayer (deposit / proxy / Safe wallet) is gasless
  surplus_haircut: 0.85  # conservative valuation haircut for deep minted surplus YES bids
  surplus_min_depth_ratio: 2.0

yes_basket:              # buy YES on every outcome of an exhaustive NegRisk event (risk: medium)
  enabled: true
  min_profit_usd: 0.15
  min_edge: 0.008
  min_apr: 0.25          # capital is locked until resolution
  max_days: 45.0
  min_unit_edge: 0.002
  max_legs: 20
  require_catch_all: true
  min_ask_sum: 0.85
  resolution_lag_days: 1.0

ladder:                  # YES weak rung + NO strong rung of an implication ladder (risk: medium)
  enabled: true
  min_profit_usd: 0.15
  min_edge: 0.006
  min_apr: 0.20
  max_days: 90.0
  min_unit_edge: 0.002
  directions: [up, down, by_date]
  resolution_lag_days: 1.0

metar:                   # NOAA/AWC METAR deterministic temperature lock + 0.994 fast flip (risk: low)
  enabled: true
  min_profit_usd: 0.08
  min_edge: 0.004
  min_unit_edge: 0.002
  basket_min_profit_usd: 0.15
  basket_min_edge: 0.005
  max_days: 2.0
  resolution_lag_days: 0.5
  fast_poll_s: 3.0       # poll interval during :49..:07 and :19..:36 METAR release windows
  idle_poll_s: 15.0
  glitch_delta_c: 12.0   # ignore isolated single-report sensor spikes larger than this
  flip_enabled: true     # immediately flip into 0.99+ bids or post resting 0.994 maker sell
  flip_ask_price: 0.994
  flip_min_instant_bid: 0.990
  flip_min_profit_usd: 0.06

binance:                 # Deterministic Binance Spot closed-candle lock + 0-hedge-leg bonding (risk: low)
  enabled: true
  min_profit_usd: 0.08
  min_edge: 0.004
  min_unit_edge: 0.002
  max_days: 2.0
  resolution_lag_days: 0.15
  burst_poll_s: 0.5      # sub-second polling around :00:00 hourly/noon/minute candle closes
  idle_poll_s: 6.0
  flip_enabled: true

crypto_short:            # Safe BTC/ETH/SOL/XRP 5m · 15m · 1h arbitrage (risk: zero to ultra-low)
  enabled: true
  min_profit_usd: 0.08
  min_edge: 0.004
  min_unit_edge: 0.002
  postclose_window_s: 120.0  # CLOB keeps the decided 5m/15m book alive well past +75s
  preclose_lock_enabled: true # exact 60s-TWAP realized-integral lock in final 2..20s
  shock_bps: 100.0            # instantaneous sustained flash-crash safety cushion (>2.2x 7-day p99.9 1m move)
  max_left_s: 20.0
  min_left_s: 2.0
  preclose_max_ask: 0.980
  taker_top_fraction: 0.85    # size a live FOK off the top ask only; deeper levels vanish before the order lands
  sync_pair_enabled: true     # 5m<->15m same-Chainlink lock + 1h Up/Down<->Above same-Binance-candle lock
  poll_slugs_s: 20.0
  flip_enabled: true

micro_arb:               # 24/7 BTC 5m cascade. Stake is the whole round; three rounds may overlap.
  enabled: true
  max_cost_usd: 10.0     # default stake per round, both legs included
  max_open_rounds: 3     # next round can enter while earlier rounds wait to redeem
  min_profit_usd: 0.04
  min_edge: 0.004
  merge_enabled: true
  merge_max_combined: 0.985
  merge_min_price: 0.38   # both legs must sit in this band; 26c/74c is a directional slope
  merge_max_price: 0.62
  merge_start_s: 5.0
  merge_window_s: 210.0  # engine A: 5s–210s of every 5m round
  hedge_depth_ratio: 2.5
  hedge_price_buffer: 0.012
  chase_max_combined: 1.005  # complete the missing leg up to 100.5c before trying to sell
  sell_safe_factor: 0.98
  corridor_enabled: true
  corridor_max_combined: 0.985
  min_strike_gap: 50.0
  corridor_start_s: 10.0
  corridor_end_s: 240.0  # engine B only until 240s; the last 25s belong to the tail
  tail_enabled: true
  tail_min_reversal_usd: 220.0
  tail_max_ask: 0.992
  tail_last_s: 25.0      # engine C: 275s–299s; closer to the strike is a safe skip
  tail_min_left_s: 1.0
  taker_top_fraction: 0.85

twin:                    # Cross-event same-oracle Range <-> Above + Close/Hit implication locks (risk: low-medium)
  enabled: true
  min_profit_usd: 0.12
  min_edge: 0.004
  min_apr: 0.50
  max_days: 7.0
  min_unit_edge: 0.001
  max_legs: 5
  resolution_lag_days: 0.5

maker:                   # postOnly zero-fee lead leg + instant FOK hedge & convert on fill (risk: low-medium)
  enabled: true
  min_profit_usd: 0.08
  min_edge: 0.006
  deterministic_min_edge: 0.004 # 0-hedge-leg locked markets (maker_metar / maker_binance / maker_crypto_short)
  deterministic_min_bid: 0.85   # skip deep illiquid mirages while catching newly-clinched >=0.85 brackets
  max_lead_spread: 0.10         # skip hollow >10c spreads while allowing active <=10c convert/ladder books
  max_reserve_fraction: 1.0     # 100% idle utilization while auto-preempting resting quotes on Taker demand
  rebate_credit_ratio: 0.75     # fraction of expected Polymarket Maker Rebate credited while keeping day-0 cash > 0
  min_keep_edge: 0.002   # cancel resting quote immediately if hedge-leg drift drops edge below this
  min_volume_24h: 500.0
  min_hedge_depth_ratio: 2.0
  max_open_quotes: 5
  max_quotes_per_event: 2
  pool_hedge_slots: 2    # reserve 100% of resting lead costs + full hedge cash for top N simultaneous fills
  allow_join_bid: true   # allow postOnly join-bid on liquid 1-tick spread books when edge clears min_edge
  repeg_after_s: 5.0     # cancel & re-peg outbid maker quotes on tight spreads after 5s
  max_legs: 8
  max_ladder_days: 10.0
  poll_s: 1.5
  quote_ttl_s: 180.0

universe:
  min_markets: 2
  max_seconds_delay: 0   # skip delayed-matching (live sports) markets
  exclude_tags: []
  refresh_minutes: 20.0
  max_book_age_s: 20.0
  gamma_filters: {}

risk:
  bankroll_usd: 1000.0
  max_trade_usd: 100.0
  max_event_exposure_usd: 250.0
  max_hold_exposure_usd: 600.0
  max_daily_loss_usd: 25.0
  max_consecutive_failures: 3
  cooldown_s: 30.0
  kill_file: KILL
  require_geo_ok: true
  liquid_reserve_usd: 0.0

execution:
  mode: paper
  slippage_ticks: 0      # strictly 0 extra ticks on first send to protect 100% win rate
  recheck_books: true    # re-fetch REST books and re-size right before sending
  fast_ws_skip_recheck_s: 2.0  # skip REST recheck on fast_turnover snipes when WS books are sub-2s fresh
  max_unwind_loss_usd: 2.5
  auto_redeem: true
  early_exit_enabled: true
  early_exit_min_bid: 0.990
  early_exit_min_profit_usd: 0.05
  lifecycle_every_s: 20.0
  journal_path: data/journal.jsonl
  state_path: data/state.json

engine:
  rest_sweep_s: 8.0
  eval_interval_ms: 50.0
  use_websocket: true
  ws_max_targets: 350
  ws_assets_per_conn: 150
  report_every_s: 60.0

tg:
  notify_executions: true
  notify_flips_redeems: true
  notify_risk: true
  notify_opportunities: false
  opportunity_min_profit_usd: 0.5
  summary_hours: 4.0
